# Fallback project definition.
#
# The checked-in FamilyVault.xcodeproj should open directly in Xcode 16 or
# later. If it ever fails to open (a corrupted merge, a much older Xcode),
# regenerate it from this file instead:
#
#   brew install xcodegen
#   cd ios/FamilyVault && rm -rf FamilyVault.xcodeproj && xcodegen generate
#
name: FamilyVault
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FamilyVault:
    type: application
    platform: iOS
    sources:
      - path: FamilyVault
    info:
      path: FamilyVault/Info.plist
    entitlements:
      path: FamilyVault/FamilyVault.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.familyvault
        PRODUCT_NAME: FamilyVault
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
